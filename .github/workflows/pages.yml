name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [[ -f index.html && -f styles.css ]]; then
            for file in index.html styles.css script.js favicon.svg robots.txt sitemap.xml README.md DESIGN.md CREDITS.md; do
              [[ -f "$file" ]] && cp "$file" _site/
            done
          else
            mkdir -p /tmp/falfool
            cat payload/site.b64.* | base64 --decode > /tmp/falfool-site.zip
            unzip -q /tmp/falfool-site.zip -d /tmp/falfool
            cp -a /tmp/falfool/falfool-site/. _site/
            rm -rf _site/.github
          fi

      - name: Materialize editable source
        if: ${{ hashFiles('index.html') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css script.js favicon.svg robots.txt sitemap.xml README.md DESIGN.md CREDITS.md; do
            cp "_site/$file" "$file"
          done
          git rm -r payload
          git add index.html styles.css script.js favicon.svg robots.txt sitemap.xml README.md DESIGN.md CREDITS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize Falfool website source"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
